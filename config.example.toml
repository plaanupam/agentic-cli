# Copy to ~/.config/agentic-cli/config.toml or run `agentic-cli config init`.

[llm]
base_url = "http://localhost:11434/v1"
api_key = "ollama"
# auto tries the OpenAI-compatible API, then Ollama's native /api/chat on HTTP 404.
# Use "openai" or "ollama" to force one protocol.
api_style = "auto"
orchestrator_model = "qwen2.5:14b"
worker_model = "qwen2.5:14b"
max_context_tokens = 8192
request_timeout_secs = 300

[gmail]
client_secret_path = "~/.config/agentic-cli/client_secret.json"
redirect_port = 8765

[storage]
sqlite_path = "~/.local/share/agentic-cli/harness.db"
log_path = "~/.local/share/agentic-cli/harness.log"

[agent]
max_supervisor_steps = 12
max_worker_steps = 8
max_tool_retries = 2
