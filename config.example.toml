# Copy to ~/.config/agentic-cli/config.toml or run `agentic-cli config init`.

[llm]
base_url = "https://openrouter.ai/api/v1"
api_key = "sk-or-..."
# openai talks to OpenRouter and other /v1/chat/completions hosts.
# auto tries that API, then Ollama's native /api/chat on HTTP 404.
# Use "ollama" to force a local Ollama server.
api_style = "openai"
orchestrator_model = "recursive/flint-v1.0:free"
worker_model = "recursive/flint-v1.0:free"
max_context_tokens = 8192
request_timeout_secs = 300

[gmail]
client_secret_path = "~/.config/agentic-cli/client_secret.json"
redirect_port = 8765

[storage]
sqlite_path = "~/.local/share/agentic-cli/harness.db"
log_path = "~/.local/share/agentic-cli/harness.log"

[agent]
max_supervisor_steps = 12
max_worker_steps = 8
max_tool_retries = 2
